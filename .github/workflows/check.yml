name: check

# 왜 있는가: 검사 도구는 있었지만 자동으로 도는 게 없어서 매번 기억해야 했다.
# 그 결과 정의되지 않은 변수를 참조하는 Edge Function 이 프로덕션까지 갔다.
# 여기서 막는다.

on:
  push:
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다 (큐 낭비 방지)
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # 로컬(v20.19.2)과 맞춘다
          # ~/.npm 캐시에 _npx 도 들어가서 deno 바이너리 재다운로드를 줄인다
          cache: npm

      - run: npm ci

      # tsc(src) + tsc(scripts·tests) + deno check(Edge) + vitest + oxlint
      - name: 타입·테스트·린트
        run: npm run check

      - name: 프로덕션 빌드
        # CI 에는 Vercel env 가 없다. 빌드 검사(scripts/check-build.ts)가 %VITE_*%
        # 치환을 요구하므로 형식만 맞는 더미를 준다 — 여기서 확인하는 것은
        # "빌드가 통과하는가"이지 "값이 맞는가"가 아니다.
        #
        # 값 검증은 Vercel 빌드에서 일어난다. 거기에 env 가 없으면 같은 검사가
        # exit 1 을 내고 **배포 자체가 막힌다**. 조용히 데모로 떨어지지 않는다.
        env:
          VITE_SUPABASE_URL: https://ciplaceholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
        run: npm run build

      # ── 드리프트 가드 ────────────────────────────────────────────
      # 랜딩 샘플 표와 샘플 리포트는 실제 계산 엔진이 생성한다. 손으로 고치면
      # 제품과 어긋나는데, 실제로 두 번 겪었다 — 존재하지 않는 라인의 MFN 9.8%,
      # 그리고 3-SKU 기준으로 계산한 landed $3.29(엔진값은 $12.56 화물 기준 $3.50).
      # 재생성 결과가 커밋된 파일과 다르면 실패시킨다.
      - name: 샘플 표가 엔진 출력과 일치하는가 (오프라인 verify)
        run: |
          npm run sample:verify
          if ! git diff --exit-code -- index.html sample-report.html; then
            echo "::error::랜딩 샘플 표가 엔진 출력과 다릅니다."
            echo "::error::index.html 의 SAMPLE_ROWS 블록을 손으로 고치지 마세요."
            echo "::error::'npm run sample:build' 를 돌리고 결과를 커밋하세요."
            exit 1
          fi

      # 사이트맵은 각 페이지의 canonical 에서 뽑는다. 손으로 고치면 그 규칙이 깨지고,
      # canonical 과 사이트맵이 서로 다른 정본을 말하게 된다.
      - name: 사이트맵이 canonical 과 일치하는가
        run: |
          npm run sitemap:build
          if ! git diff --exit-code -- public/robots.txt public/sitemap.xml public/sitemaps/; then
            echo "::error::사이트맵이 페이지의 canonical 과 다릅니다."
            echo "::error::public/sitemap.xml 을 손으로 고치지 마세요 — 생성물입니다."
            echo "::error::'npm run sitemap:build' 를 돌리고 결과를 커밋하세요."
            exit 1
          fi

      # 발행된 HTML 을 손으로 고치면 원문(content/blog/*.md)과 갈라진다.
      # 갈라지는 순간 "무엇이 발행됐는가" 의 진실 출처가 둘이 된다 — 샘플 리포트에서
      # 이미 겪은 실패다. 재생성 결과가 커밋본과 다르면 여기서 막는다.
      - name: 발행된 에디토리얼이 원문과 일치하는가
        run: |
          npm run blog:verify
          if ! git diff --exit-code -- blog.html blog/; then
            echo "::error::발행된 블로그 HTML 이 content/blog/ 의 원문과 다릅니다."
            echo "::error::blog/*.html 을 손으로 고치지 마세요 — 생성물입니다."
            echo "::error::'npm run blog:build' 를 돌리고 결과를 커밋하세요."
            exit 1
          fi

  # ── 퍼널 계측 ────────────────────────────────────────────────────
  # 별도 job 인 이유: 브라우저는 성격이 다른 의존성이다. 다운로드가 흔들릴 때
  # 타입·테스트·린트 신호까지 같이 막히면 안 되고, 병렬로 돌아 전체 시간도
  # 늘지 않는다.
  #
  # 왜 검사하는가: 계측은 빠져도 페이지가 멀쩡히 동작해서 사람이 알아채지
  # 못한다. 실제로 /app 안에만 계측이 있는 채로 63 클릭 ₩134,729 을 썼고,
  # 그 돈이 어디서 죽었는지 지금도 모른다. check-build 는 문자열 존재만 보므로
  # **정말 전송되는지**는 브라우저를 띄워야 알 수 있다.
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # --only-shell 은 쓰지 않는다. 헤드리스 셸만 받으면 Playwright 버전에 따라
      # chromium.launch() 가 실행 파일을 못 찾고, 그 실패는 계측 회귀와 구별되지
      # 않는다. 가드가 자기 환경 문제로 죽으면 사람들은 가드를 끈다.
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 프로덕션 빌드
        env:
          VITE_SUPABASE_URL: https://ciplaceholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
        run: npm run build

      # page_view · 조회 · 폼 제출/실패 · 댓글 저장/실패 이벤트가 실제로 나가는지,
      # 그리고 저장이 실패했을 때 사용자에게 메시지가 보이는지까지 본다.
      - name: 퍼널 이벤트가 실제로 전송되는가
        run: npm run smoke:funnel
